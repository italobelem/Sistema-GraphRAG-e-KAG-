services:
  neo4j:
    image: neo4j:5.23.0
    container_name: neo4j-graphrag-cti
    ports:
      - "7474:7474" 
      - "7687:7687" 
    environment:
      - NEO4J_AUTH=neo4j/senha_forte_123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs